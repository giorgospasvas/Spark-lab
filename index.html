<!DOCTYPE html>
<html lang="en">
    <head>
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta charset="utf-8"/>
        <meta http-equiv="pragma" content="no-cache"/>

        <title>Spark lab</title>
        <link rel="icon" type="image/x-icon" href="./favicon.ico?v=3">

        <style>
            body {
                background: #0d1117;
                color: #cccccc;
                margin: 0px;
                padding: 0px;
                border: 0px;
                overflow: hidden;
            }

            canvas {
                image-rendering: optimizeSpeed;
                -webkit-interpolation-mode: nearest-neighbor;
                -ms-touch-action: none;
                touch-action: none;
                margin: 0px;
                padding: 0px;
                border: 0px;
            }

            :-webkit-full-screen #canvas { width: 100%; height: 100%; }
            :-webkit-full-screen { width: 100%; height: 100%; }
            
            div.gm4html5_div_class {
                margin: 0px;
                padding: 0px;
                border: 0px;
            }

            /* Modern Loader Overlay */
            #custom-loader {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: #0d1117;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 99999;
                transition: opacity 0.5s ease;
                pointer-events: none; /* Prevents clicks from being blocked */
            }

            .spinner {
                width: 50px;
                height: 50px;
                border: 4px solid rgba(255, 255, 255, 0.1);
                border-top: 4px solid #58a6ff;
                border-radius: 50%;
                animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            }

            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }

            .loader-text {
                margin-top: 20px;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-size: 16px;
                font-weight: 500;
                color: #8b949e;
                letter-spacing: 1px;
            }
        </style>
    </head>

    <body>
        <!-- Modern Spinner Overlay -->
        <div id="custom-loader">
            <div class="spinner"></div>
            <div class="loader-text">Loading Spark Lab...</div>
        </div>

        <div class="gm4html5_div_class" id="gm4html5_div_id">
            <canvas id="canvas" width="1920" height="1080">
                <p>Your browser doesn't support HTML5 canvas.</p>
            </canvas>
        </div>

        <!-- GameMaker Runner Script -->
        <script type="text/javascript" src="html5game/Spark lab (1).js?cachebust=1886549041"></script>

        <script>
            function removeLoader() {
                var loader = document.getElementById("custom-loader");
                if (loader && loader.style.display !== 'none') {
                    loader.style.opacity = '0';
                    setTimeout(function() {
                        loader.style.display = 'none';
                    }, 500);
                }
            }

            window.onload = function() {
                if (typeof GameMaker_Init === "function") {
                    GameMaker_Init();
                }

                // 1. Check for standard GameMaker execution
                var checkInterval = setInterval(function() {
                    var runner = window.g_pGMRunner || (typeof g_pGMRunner !== "undefined" ? g_pGMRunner : null);
                    if (runner && (runner.m_bInit || runner.m_InitState > 0 || runner.m_pAudioEngine)) {
                        removeLoader();
                        clearInterval(checkInterval);
                    }
                }, 100);

                // 2. Safety Fallback: Automatically dismiss loader after 2.5 seconds
                setTimeout(function() {
                    removeLoader();
                    clearInterval(checkInterval);
                }, 2500);
            };
        </script>
    </body>
</html>
