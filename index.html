<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="referrer" content="no-referrer" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta charset="utf-8"/>
        <meta http-equiv="pragma" content="no-cache"/>

        <title>Spark lab</title>
        <link rel="icon" type="image/x-icon" href="./favicon.ico?v=5">

        <style>
            body {
                background: #0d1117;
                color: #cccccc;
                margin: 0px;
                padding: 0px;
                border: 0px;
                overflow: hidden;
            }

            canvas {
                image-rendering: optimizeSpeed;
                -webkit-interpolation-mode: nearest-neighbor;
                -ms-touch-action: none;
                touch-action: none;
                margin: 0px;
                padding: 0px;
                border: 0px;
            }

            :-webkit-full-screen #canvas { width: 100%; height: 100%; }
            :-webkit-full-screen { width: 100%; height: 100%; }
            
            div.gm4html5_div_class {
                margin: 0px;
                padding: 0px;
                border: 0px;
            }

            /* Fullscreen Overlay Container */
            #custom-loader {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: #0d1117;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                z-index: 99999;
                transition: opacity 0.5s ease;
                pointer-events: none;
            }

            /* Animated Logo Loader Styles */
            .logo-loader-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            .pulsing-logo {
                width: 120px;
                height: auto;
                animation: logo-glow-pulse 1.8s ease-in-out infinite;
                filter: drop-shadow(0 0 15px rgba(88, 166, 255, 0.4));
            }

            .mini-bar {
                width: 180px;
                height: 4px;
                background: #21262d;
                border-radius: 4px;
                margin-top: 25px;
                overflow: hidden;
                position: relative;
            }

            .mini-bar::after {
                content: '';
                position: absolute;
                top: 0;
                left: -50%;
                width: 50%;
                height: 100%;
                background: linear-gradient(90deg, #58a6ff, #bc8cff);
                border-radius: 4px;
                animation: bar-slide 1.2s infinite ease-in-out;
            }

            .loader-text {
                margin-top: 14px;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-size: 13px;
                color: #8b949e;
                letter-spacing: 1.5px;
                text-transform: uppercase;
            }

            @keyframes logo-glow-pulse {
                0%, 100% {
                    transform: scale(1);
                    filter: drop-shadow(0 0 8px rgba(88, 166, 255, 0.3));
                }
                50% {
                    transform: scale(1.08);
                    filter: drop-shadow(0 0 25px rgba(88, 166, 255, 0.85));
                }
            }

            @keyframes bar-slide {
                0% { left: -50%; }
                100% { left: 100%; }
            }
        </style>
    </head>

    <body>
        <!-- Animated Custom Loader Overlay -->
        <div id="custom-loader">
            <div class="logo-loader-container">
                <img src="./favicon.ico" class="pulsing-logo" alt="Spark Lab Logo">
                <div class="mini-bar"></div>
                <div class="loader-text">Loading Spark Lab...</div>
            </div>
        </div>

        <div class="gm4html5_div_class" id="gm4html5_div_id">
            <canvas id="canvas" width="1920" height="1080">
                <p>Your browser doesn't support HTML5 canvas.</p>
            </canvas>
        </div>

        <!-- GameMaker Runner Script -->
        <script type="text/javascript" src="html5game/Spark lab (1).js?cachebust=1886549041"></script>

        <script>
            function hideLoader() {
                var loader = document.getElementById("custom-loader");
                if (loader && loader.style.display !== "none") {
                    loader.style.opacity = "0";
                    setTimeout(function() {
                        loader.style.display = "none";
                    }, 500);
                }
            }

            // Start GameMaker
            if (typeof GameMaker_Init === "function") {
                GameMaker_Init();
            } else {
                window.addEventListener("load", function() {
                    if (typeof GameMaker_Init === "function") {
                        GameMaker_Init();
                    }
                });
            }

            // Hide loader as soon as the engine runner is active
            var checkEngine = setInterval(function() {
                var runner = window.g_pGMRunner || (typeof g_pGMRunner !== "undefined" ? g_pGMRunner : null);
                if (runner) {
                    hideLoader();
                    clearInterval(checkEngine);
                }
            }, 100);

            // Safety limit: dismiss loader after 2 seconds regardless of runner state
            setTimeout(function() {
                hideLoader();
                clearInterval(checkEngine);
            }, 2000);
        </script>
    </body>
</html>
