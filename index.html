        <!-- Custom Loading Bar Function -->
        <script type="text/javascript">
        function custom_loading_bar(ctx, width, height, total, current, image) {
            // 1. Clear background (Dark theme)
            ctx.fillStyle = "#0d1117";
            ctx.fillRect(0, 0, width, height);

            // 2. Draw Splash / Logo centered (if available)
            if (image) {
                var imgWidth = image.width;
                var imgHeight = image.height;
                var maxW = width * 0.4;
                if (imgWidth > maxW) {
                    var scale = maxW / imgWidth;
                    imgWidth *= scale;
                    imgHeight *= scale;
                }
                var imgX = (width - imgWidth) / 2;
                var imgY = (height - imgHeight) / 2 - 40;
                ctx.drawImage(image, imgX, imgY, imgWidth, imgHeight);
            }

            // 3. Calculate Progress
            var progress = total > 0 ? (current / total) : 0;
            progress = Math.min(Math.max(progress, 0), 1);

            // 4. Bar Dimensions
            var barWidth = Math.min(width * 0.5, 400);
            var barHeight = 8;
            var barX = (width - barWidth) / 2;
            var barY = (height / 2) + 60;

            // 5. Draw Bar Background (Track)
            ctx.fillStyle = "#21262d";
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(barX, barY, barWidth, barHeight, 4);
            } else {
                ctx.rect(barX, barY, barWidth, barHeight);
            }
            ctx.fill();

            // 6. Draw Filled Bar (Neon Gradient)
            if (progress > 0) {
                var gradient = ctx.createLinearGradient(barX, 0, barX + barWidth, 0);
                gradient.addColorStop(0, "#58a6ff");
                gradient.addColorStop(1, "#bc8cff");
                ctx.fillStyle = gradient;

                ctx.beginPath();
                var fillWidth = barWidth * progress;
                if (ctx.roundRect) {
                    ctx.roundRect(barX, barY, fillWidth, barHeight, 4);
                } else {
                    ctx.rect(barX, barY, fillWidth, barHeight);
                }
                ctx.fill();
            }

            // 7. Draw Percentage & Status Text
            ctx.fillStyle = "#8b949e";
            ctx.font = "14px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("Loading... " + Math.round(progress * 100) + "%", width / 2, barY + 28);
        }

        window.custom_loading_bar = custom_loading_bar;
        </script>
